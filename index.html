<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>RADIO BUTTONS - STYLED</title>
  </head>
  <body>
    <div class="container">
      <h1>RADIO BUTTONS</h1>
      <form id="optionsForm">
        <div class="select-title">Select an option</div>
        <div class="option">
          <label for="radio1">
            <input
              type="radio"
              name="options"
              id="radio1"
              value="red"
              checked
            />
            <span class="ball"></span>
          </label>
          <div class="optionText">
            red <span class="defaultText">(default)</span>
          </div>
        </div>
        <div class="option">
          <label for="radio2">
            <input type="radio" name="options" id="radio2" value="orange" />
            <span class="ball"></span>
          </label>
          <div class="optionText">orange</div>
        </div>
        <div class="option">
          <label for="radio3">
            <input type="radio" name="options" id="radio3" value="yellow" />
            <span class="ball"></span>
          </label>
          <div class="optionText">yellow</div>
        </div>
        <div class="option">
          <label for="radio4">
            <input type="radio" name="options" id="radio4" value="green" />
            <span class="ball"></span>
          </label>
          <div class="optionText">green</div>
        </div>
        <div class="option">
          <label for="radio5">
            <input type="radio" name="options" id="radio5" value="blue" />
            <span class="ball"></span>
          </label>
          <div class="optionText">blue</div>
        </div>
        <div class="option">
          <label for="radio6">
            <input type="radio" name="options" id="radio6" value="indigo" />
            <span class="ball"></span>
          </label>
          <div class="optionText">indigo</div>
        </div>
        <div class="option">
          <label for="radio7">
            <input type="radio" name="options" id="radio7" value="violet" />
            <span class="ball"></span>
          </label>
          <div class="optionText">violet</div>
        </div>
      </form>

      <!-- Display box with selected color -->
      <div id="result" class="result"></div>

      <!-- Reset to first option -->
      <input type="button" class="btn" id="clearBtn" value="Clear" />
    </div>

    <!-- copyright info -->
    <div id="copy" class="copy"></div>

    <script src="script.js"></script>
  </body>
</html>
